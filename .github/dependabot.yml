# Dependabot proposes updates as pull requests: the tools (dts-site-tools, through composer.json)
# wait for the user's review; the site's WordPress.org plugins merge themselves once their checks
# pass (plugin-updates.yml, template plan T9).
# Not here: the tools' own packages, images and actions are updated in dts-site-tools; the site's
# workflows call its shared ones by commit, which bin/tools-pin raises, so Dependabot has no
# actions to update here (it would raise that commit apart from composer.lock, template plan T18).
version: 2

updates:
  # The tools (composer.json, composer.lock), at the release composer.json names; the PHP checkers
  # come with them at the versions the tools require, so only the tools themselves are proposed.
  # A tools update fails bin/check's pin check until bin/tools-pin has run on its branch (T18).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    # Hijacked releases are usually found and pulled within days; waiting a week means a release
    # is only proposed once it has survived that. Security updates are not held back by this.
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "dts/site-tools"
    commit-message:
      prefix: "build"
      include: "scope"

  # The downloaded plugins the site runs (site-packages/, template plan T8, T9): WordPress.org's
  # plugins through WPackagist, each at an exact version. All in one weekly pull request, which
  # merges itself once its checks pass (plugin-updates.yml): two pull requests merging on their
  # own would leave the second behind main, where it waits, since Dependabot rebases only on a
  # conflict. A failing update holds the others back that week; the failure names the plugin.
  - package-ecosystem: "composer"
    directory: "/site-packages"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    # Only WordPress.org's plugins in the weekly group that merges itself; composer/installers
    # (it runs code as Composer installs) arrives in a pull request of its own, for review.
    groups:
      site-plugins:
        patterns:
          - "wpackagist-plugin/*"
    commit-message:
      prefix: "build"
      include: "scope"
