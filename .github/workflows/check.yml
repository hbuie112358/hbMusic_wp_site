# Written by dts-site-tools' bin/tools-pin from its tools/site-workflows/check.yml; bin/check fails
# when this file differs from what bin/tools-pin writes, so it is changed in the tools, never here.
#
# Runs on each pull request, weekly and by its button: the tools' shared checks (site-check.yml),
# pinned to the commit of the tools release composer.lock installs. Its two jobs, the static checks
# and the dev site's tests, are the checks main's protection requires, and those bin/deploy accepts
# a commit by. A merge deploys nothing: the user deploys with bin/deploy.
name: check

on:
  pull_request:
  # Weekly, so the security audits catch advisories published for packages already in use,
  # even when no code changes (Mondays 06:17 UTC; an off-minute avoids the busy hour mark).
  schedule:
    - cron: "17 6 * * 1"
  # The "Run workflow" button: the checks on demand.
  workflow_dispatch:

# Read-only access to the repository is all the checks need.
permissions:
  contents: read

# A newer push to a pull request makes its older run pointless. Runs on main (the weekly run and
# the button) are not cancelled, so each one reports in full.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pinned by commit, not by tag: a tag can be moved to different code, a commit cannot.
    uses: direct-technical-solutions/dts-site-tools/.github/workflows/site-check.yml@6c3fc58590993e84f4a633d734b13723d4f9eca5 # v0.4.2
