# Written by dts-site-tools' bin/tools-pin from its tools/site-workflows/versions.yml; bin/check
# fails when this file differs from what bin/tools-pin writes, so it is changed in the tools, never
# here.
#
# Weekly: the tools' versions check (site-versions.yml), pinned to the commit of the tools release
# composer.lock installs. It compares the dev site's parent theme with WordPress.org and watches
# Dependabot's plugin updates, opening an issue for what needs the user (GitHub emails the owner).
# It changes no code.
name: versions

on:
  # Mondays 06:41 UTC, after Dependabot's run and away from the busy hour mark.
  schedule:
    - cron: "41 6 * * 1"
  # The "Run workflow" button; the wait can be shortened there, for a release needed sooner.
  workflow_dispatch:
    inputs:
      cooldown-days:
        description: "Days a release must be out before it is proposed"
        required: false
        default: "7"

# Exactly what the check needs: reading the repository and its pull requests, and opening issues.
# No secrets, no write access to code.
permissions:
  contents: read
  pull-requests: read
  issues: write

# Two runs at once could both open the same proposal.
concurrency:
  group: versions
  cancel-in-progress: false

jobs:
  versions:
    # Pinned by commit, not by tag: a tag can be moved to different code, a commit cannot.
    uses: direct-technical-solutions/dts-site-tools/.github/workflows/site-versions.yml@2df05aa7f67881e44d5ffe6696f8d2358fc76684 # v0.7.0
    with:
      # The weekly run has no inputs, so it takes the usual wait.
      cooldown-days: ${{ inputs.cooldown-days || '7' }}
