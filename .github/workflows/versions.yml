# Weekly: compares the dev site's pinned parent theme with WordPress.org (bin/versions-check,
# plan 8j) and opens an issue for a newer one. It changes no code. The downloaded plugins are
# raised by Dependabot instead (site-packages/, template plan T8).
name: versions

on:
  # Mondays 06:41 UTC, after Dependabot's run and away from the busy hour mark.
  schedule:
    - cron: "41 6 * * 1"
  # The "Run workflow" button; the wait can be shortened there, for a release needed sooner.
  workflow_dispatch:
    inputs:
      cooldown-days:
        description: "Days a release must be out before it is proposed"
        required: false
        default: "7"

# Exactly what the check needs: reading the repository and opening the theme's issue. No secrets,
# no write access to code.
permissions:
  contents: read
  issues: write

# Two runs at once could both open the same proposal.
concurrency:
  group: versions
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned by commit, like check.yml. Nothing is pushed, so the token is not kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the theme's pin with WordPress.org and open an issue if it is behind (bin/versions-check --act)
        run: bin/versions-check --act
        env:
          GH_TOKEN: ${{ github.token }}
          PINS_COOLDOWN_DAYS: ${{ inputs.cooldown-days || '7' }}
