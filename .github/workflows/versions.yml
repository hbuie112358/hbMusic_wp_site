# Weekly: compares the dev site's pinned parent theme with WordPress.org (bin/versions-check,
# plan 8j) and watches Dependabot's plugin updates (template plan T9): an issue for a newer theme,
# for a plugin update still waiting after a few days, for a plugin release Dependabot never
# proposed, and for a package of bin/deploy's test server that Alpine replaced (template plan
# 1.4d-4). GitHub emails the owner about new issues. It changes no code.
name: versions

on:
  # Mondays 06:41 UTC, after Dependabot's run and away from the busy hour mark.
  schedule:
    - cron: "41 6 * * 1"
  # The "Run workflow" button; the wait can be shortened there, for a release needed sooner.
  workflow_dispatch:
    inputs:
      cooldown-days:
        description: "Days a release must be out before it is proposed"
        required: false
        default: "7"

# Exactly what the check needs: reading the repository and its pull requests, and opening issues.
# No secrets, no write access to code.
permissions:
  contents: read
  pull-requests: read
  issues: write

# Two runs at once could both open the same proposal.
concurrency:
  group: versions
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned by commit, like check.yml. Nothing is pushed, so the token is not kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the theme with WordPress.org, watch the plugin updates and the test server's Alpine packages; open issues for what needs the user (bin/versions-check --act)
        run: bin/versions-check --act
        env:
          GH_TOKEN: ${{ github.token }}
          PINS_COOLDOWN_DAYS: ${{ inputs.cooldown-days || '7' }}
