# Local copy of the old site, for the rebuild (plan step 3). Never used in production.
# Settings come from .env (created by bin/local-import from .env.example).
name: hbmusic

# One set of database and WordPress settings, shared by the site and WP-CLI: the generated
# wp-config.php reads them from the environment at runtime, so both containers need the same.
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:?set in .env}
  WORDPRESS_DB_USER: ${DB_USER:?set in .env}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set in .env}
  WORDPRESS_TABLE_PREFIX: wp_
  # Where FluentSMTP sends mail locally: the Mailpit container's SMTP port, reachable only on
  # the project's internal network (local/wp-cli/configure-fluentsmtp-mailpit.php).
  LOCAL_SMTP_HOST: mailpit
  LOCAL_SMTP_PORT: "1025"
  LOCAL_MAIL_FROM: ${LOCAL_MAIL_FROM:?set in .env}
  LOCAL_MAIL_FROM_NAME: ${LOCAL_MAIL_FROM_NAME:?set in .env}
  # The image's wp-config.php defines WP_DEBUG from this; defining it again warns.
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_HOME', 'http://localhost:${SITE_PORT}' );
    define( 'WP_SITEURL', 'http://localhost:${SITE_PORT}' );
    define( 'DISALLOW_FILE_EDIT', true );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

services:
  db:
    # The exact version the live database runs (from the dump's header).
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: ${DB_NAME:?set in .env}
      MARIADB_USER: ${DB_USER:?set in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    # Same WordPress as live; PHP 8.4 has security support until the end of 2028.
    image: wordpress:7.1.4-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    environment: *wordpress-env
    ports:
      # Bound to this computer only: the local copy is not reachable from the network.
      - "127.0.0.1:${SITE_PORT:?set in .env}:80"
    volumes:
      # Core and wp-content live in a volume, not in the project folder, so files written by
      # the web server never land on the host owned by a subordinate user id (rootless Docker).
      - wp_html:/var/www/html

  cli:
    image: wordpress:cli-2.12-php8.4
    profiles: ["tools"]
    # The CLI image's default user differs from the web server's; uid 33 is www-data in the
    # Debian-based WordPress image, so files the CLI writes stay readable and writable by it.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      # uid 33 has no writable home folder; WP-CLI's download cache goes to /tmp instead.
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_html:/var/www/html
      # The old site and its dump, read-only: plan decision D2.
      - ./wordpress/wp-content:/import/wp-content:ro
      - ./db:/import/db:ro
      # WP-CLI scripts for the local copy (local/wp-cli/), read-only.
      - ./local/wp-cli:/local/wp-cli:ro

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:?set in .env}:8025"

volumes:
  db_data:
  wp_html:
