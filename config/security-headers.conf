# The site's security headers (docs/SITE_CHECKLIST.md 3.2), in one place: the dev site's Apache
# reads this file (compose.dev.yaml), and the live site's server gets the same lines at plan
# step 8. Apache syntax; whether LiteSpeed (the host's server) accepts the expr= conditions is
# checked at step 8.
#
# Visitor pages only for now: the WordPress admin and login are left out until step 8, since the
# block editor uses techniques a policy can break, which needs its own testing there.
#
# The Content-Security-Policy, approach B of the checklist review: code may come only from the
# site itself, inline code is allowed (WordPress core and block styles write it), and the rules
# that rarely change are strict. Each outside source added later is listed here with its reason.
#   default-src 'self'                   anything not listed below: the site itself only
#   script-src 'self' 'unsafe-inline'    WordPress core prints small inline scripts; Cloudflare
#                                        Turnstile's script protects the booking form (5e)
#   style-src 'self' 'unsafe-inline'     block styles arrive as inline <style>
#   img-src 'self' data:                 data: for small inline images WordPress uses
#   font-src 'self'                      fonts are self-hosted (checklist 8.4)
#   connect-src 'self'                   background requests only to the site (REST API)
#   frame-src 'self' + YouTube           the site's videos always play from YouTube (plan D19);
#                                        WordPress embeds use youtube.com, the privacy-enhanced
#                                        player youtube-nocookie.com; Turnstile's widget is a frame
#   object-src 'none'                    no plugins such as Flash
#   base-uri 'self'                      the page's base address cannot be redirected
#   form-action 'self'                   forms are sent only to the site
#   frame-ancestors 'self'               no other site may frame these pages (clickjacking)
<If "%{REQUEST_URI} !~ m#^/(wp-admin|wp-login\.php)#">
	Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
</If>
