# The dev site: a fresh WordPress with the child theme and scripted test content, for building
# and testing the new theme and plugins (plan step 4b). It runs alone, also in CI, and never holds
# real data. Never used in production.
# Settings come from .env (the DEV_ names; bin/dev-site creates or completes it). The site's own
# part, its name and the folders it mounts (its theme, its own plugins and the tools' dev-only
# must-use plugins), is compose.site.yaml, written from site.json by bin/dev-site, bin/check and
# bin/screenshots (template plan 1.2f); this file is the same for every site.

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DEV_DB_NAME:?set in .env}
  WORDPRESS_DB_USER: ${DEV_DB_USER:?set in .env}
  WORDPRESS_DB_PASSWORD: ${DEV_DB_PASSWORD:?set in .env}
  WORDPRESS_TABLE_PREFIX: wp_
  # The image's wp-config.php defines WP_DEBUG from this; defining it again warns.
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_HOME', 'http://localhost:${DEV_SITE_PORT}' );
    define( 'WP_SITEURL', 'http://localhost:${DEV_SITE_PORT}' );
    define( 'DISALLOW_FILE_EDIT', true );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

services:
  db:
    # The same version as the live site.
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: ${DEV_DB_NAME:?set in .env}
      MARIADB_USER: ${DEV_DB_USER:?set in .env}
      MARIADB_PASSWORD: ${DEV_DB_PASSWORD:?set in .env}
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1.4-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    environment: *wordpress-env
    ports:
      # Bound to this computer only.
      - "127.0.0.1:${DEV_SITE_PORT:?set in .env}:80"
    # The site's theme and its own plugins are mounted read-only by compose.site.yaml: WordPress
    # can never write into the user's files, and files the user creates on the host stay the
    # user's (the permission check of 3c).
    # The dev-only must-use plugins (mail to Mailpit, a stand-in for Cloudflare, never deployed) are
    # the tools' own files, so compose.site.yaml mounts them from the tools' folder: Compose reads
    # a relative path here from the site's repository, where they are not once the tools have
    # their own (template plan T19).
    volumes:
      - wp_html:/var/www/html

  # Catches the site's mail, so none ever leaves this computer. Bound to this computer only.
  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      # Lets a test make Mailpit refuse mail through its API, to show what a visitor sees when
      # the site cannot send (booking-form.spec.ts). Off until a test turns it on.
      MP_ENABLE_CHAOS: "true"
    ports:
      - "127.0.0.1:${DEV_MAIL_UI_PORT:?set in .env}:8025"

  cli:
    image: wordpress:cli-2.12-php8.4
    profiles: ["tools"]
    # uid 33 is www-data in the WordPress image, so WP-CLI can write what WordPress can.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    # The dev-only must-use plugins too, mounted by compose.site.yaml as for the site: WP-CLI saving
    # a page fetches its videos' pictures (the theme, plan 9v), which must be answered here too,
    # never by the real YouTube.
    volumes:
      - wp_html:/var/www/html

volumes:
  db_data:
  wp_html:
